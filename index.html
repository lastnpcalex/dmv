<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone vs Meme vs Virus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .rules {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .rules h3 {
            margin-bottom: 15px;
            color: #ffd700;
        }

        .rule {
            margin: 8px 0;
            font-size: 1.05em;
        }

        .choices {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .choice-btn {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px 30px;
            font-size: 1.8em;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            min-width: 140px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .choice-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.2));
        }

        .choice-btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        .battle-area {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .battle-display {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .fighter {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .fighter-icon {
            font-size: 4em;
            margin-bottom: 10px;
            animation: bounce 0.5s ease;
        }

        .fighter-label {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .vs {
            font-size: 2em;
            font-weight: bold;
            color: #ffd700;
            animation: pulse 1s infinite;
        }

        .result {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            animation: slideIn 0.5s ease;
        }

        .win {
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .lose {
            color: #f87171;
            text-shadow: 0 0 20px rgba(248, 113, 113, 0.5);
        }

        .tie {
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
        }

        .reset-btn {
            background: linear-gradient(145deg, #ef4444, #dc2626);
            border: none;
            border-radius: 15px;
            padding: 12px 30px;
            font-size: 1.1em;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto 0;
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes slideIn {
            from { 
                transform: translateY(-20px);
                opacity: 0;
            }
            to { 
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚁 DRONE vs MEME vs VIRUS 🎮</h1>
        <div class="subtitle">The Ultimate Digital Showdown!</div>
        
        <div class="rules">
            <h3>⚔️ Battle Rules ⚔️</h3>
            <div class="rule">🚁 <strong>Drone beats Meme</strong> (surveillance defeats virality)</div>
            <div class="rule">😂 <strong>Meme beats Virus</strong> (humor conquers malware)</div>
            <div class="rule">🦠 <strong>Virus beats Drone</strong> (corrupts the system)</div>
        </div>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">YOU</div>
                <div class="score-value" id="player-score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">TIES</div>
                <div class="score-value" id="tie-score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">COMPUTER</div>
                <div class="score-value" id="computer-score">0</div>
            </div>
        </div>

        <div class="choices">
            <button class="choice-btn" onclick="play('drone')">🚁<br>Drone</button>
            <button class="choice-btn" onclick="play('meme')">😂<br>Meme</button>
            <button class="choice-btn" onclick="play('virus')">🦠<br>Virus</button>
        </div>

        <div class="battle-area" id="battle-area">
            <div style="text-align: center; opacity: 0.7; font-size: 1.2em;">
                Choose your fighter to begin the battle!
            </div>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <script>
        let playerScore = 0;
        let computerScore = 0;
        let tieScore = 0;

        const icons = {
            drone: '🚁',
            meme: '😂',
            virus: '🦠'
        };

        const winConditions = {
            drone: 'meme',
            meme: 'virus',
            virus: 'drone'
        };

        function play(playerChoice) {
            const choices = ['drone', 'meme', 'virus'];
            const computerChoice = choices[Math.floor(Math.random() * 3)];
            
            let result = determineWinner(playerChoice, computerChoice);
            updateDisplay(playerChoice, computerChoice, result);
            updateScore(result);
        }

        function determineWinner(player, computer) {
            if (player === computer) {
                return 'tie';
            } else if (winConditions[player] === computer) {
                return 'win';
            } else {
                return 'lose';
            }
        }

        function updateDisplay(player, computer, result) {
            const battleArea = document.getElementById('battle-area');
            
            let resultText = '';
            let resultClass = '';
            let explanation = '';
            
            if (result === 'win') {
                resultText = '🎉 YOU WIN! 🎉';
                resultClass = 'win';
                explanation = getWinExplanation(player, computer);
            } else if (result === 'lose') {
                resultText = '💀 YOU LOSE! 💀';
                resultClass = 'lose';
                explanation = getWinExplanation(computer, player);
            } else {
                resultText = '🤝 IT\'S A TIE! 🤝';
                resultClass = 'tie';
                explanation = 'Great minds think alike!';
            }
            
            battleArea.innerHTML = `
                <div class="battle-display">
                    <div class="fighter">
                        <div class="fighter-icon">${icons[player]}</div>
                        <div class="fighter-label">You: ${player.toUpperCase()}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="fighter">
                        <div class="fighter-icon">${icons[computer]}</div>
                        <div class="fighter-label">Computer: ${computer.toUpperCase()}</div>
                    </div>
                </div>
                <div class="result ${resultClass}">${resultText}</div>
                <div style="text-align: center; opacity: 0.9; font-size: 1.1em;">
                    ${explanation}
                </div>
            `;
        }

        function getWinExplanation(winner, loser) {
            if (winner === 'drone' && loser === 'meme') {
                return 'Drone surveillance captures the meme!';
            } else if (winner === 'meme' && loser === 'virus') {
                return 'Meme spreads faster than the virus!';
            } else if (winner === 'virus' && loser === 'drone') {
                return 'Virus corrupts the drone\'s system!';
            }
            return '';
        }

        function updateScore(result) {
            if (result === 'win') {
                playerScore++;
                document.getElementById('player-score').textContent = playerScore;
            } else if (result === 'lose') {
                computerScore++;
                document.getElementById('computer-score').textContent = computerScore;
            } else {
                tieScore++;
                document.getElementById('tie-score').textContent = tieScore;
            }
        }

        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            tieScore = 0;
            document.getElementById('player-score').textContent = '0';
            document.getElementById('computer-score').textContent = '0';
            document.getElementById('tie-score').textContent = '0';
            document.getElementById('battle-area').innerHTML = `
                <div style="text-align: center; opacity: 0.7; font-size: 1.2em;">
                    Choose your fighter to begin the battle!
                </div>
            `;
        }
    </script>
</body>
</html>
